<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória - Rio de Janeiro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('fundo_rio.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #1a1a2e;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: flex-end; 
            align-items: center;
            overflow: hidden;
        }

        .game-area {
            width: 72vw; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 4vw 20px 0;
            position: relative;
        }

        .btn-restart-top {
            position: absolute;
            top: 20px;
            right: 4vw;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #e94560;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            z-index: 5;
        }

        .btn-restart-top:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }

        .board {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 12px;
            width: 100%;
            max-width: 65vw;
            max-height: 85vh;
            perspective: 1000px;
        }

        .card {
            background-color: transparent;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.4s ease, opacity 0.5s ease, visibility 0.5s ease;
            aspect-ratio: 2 / 3;
            width: calc((100% / 6) - 12px); 
            max-height: 25vh;
            border-radius: 8px;
            z-index: 1;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        /* Animação de zoom ao acertar o par */
        .card.zoom {
            transform: rotateY(180deg) scale(1.15);
            z-index: 10;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* Desaparecimento após a leitura */
        .card.matched {
            transform: rotateY(180deg) scale(0.8);
            opacity: 0;
            visibility: hidden;
            cursor: default;
            pointer-events: none;
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 8px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Verso da carta */
        .front {
            background-image: url('verso_v2.png'); 
            transform: rotateY(0deg);
        }

        /* Frente da carta */
        .back {
            transform: rotateY(180deg);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 20;
        }

        .modal h2 {
            font-size: 3.5rem;
            color: #4eacc5;
            margin-bottom: 20px;
        }

        .btn-reset {
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            background-color: #e94560;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-reset:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="game-area">
        <button class="btn-restart-top" onclick="initGame()">Recomeçar</button>
        <div class="board" id="board"></div>
    </div>

    <div class="modal" id="winModal">
        <h2>Parabéns! Você Venceu! 🎉</h2>
        <button class="btn-reset" onclick="initGame()">Jogar Novamente</button>
    </div>

    <script>
        const pairData = [
            { id: 1, imgA: 'par1a.png', imgB: 'par1b.png' },
            { id: 2, imgA: 'par2a.png', imgB: 'par2b.png' },
            { id: 3, imgA: 'par3a.png', imgB: 'par3b.png' },
            { id: 4, imgA: 'par4a.png', imgB: 'par4b.png' },
            { id: 5, imgA: 'par5a.png', imgB: 'par5b.png' },
            { id: 6, imgA: 'par6a.png', imgB: 'par6b.png' },
            { id: 7, imgA: 'par7a.png', imgB: 'par7b.png' },
            { id: 8, imgA: 'par8a.png', imgB: 'par8b.png' }
        ];

        let cards = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let matchedPairs = 0;

        function createDeck() {
            cards = [];
            pairData.forEach(pair => {
                cards.push({ id: pair.id, img: pair.imgA });
                cards.push({ id: pair.id, img: pair.imgB });
            });
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            cards.forEach(cardData => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.id = cardData.id;

                card.innerHTML = `
                    <div class="face front"></div>
                    <div class="face back" style="background-image: url('${cardData.img}');"></div>
                `;

                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flipped');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.id === secondCard.dataset.id;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            lockBoard = true;

            // Aplica a animação de zoom/destaque imediatamente
            firstCard.classList.add('zoom');
            secondCard.classList.add('zoom');

            // Aguarda 1.5 segundos para o jogador ler o conteúdo do par
            setTimeout(() => {
                firstCard.classList.remove('zoom');
                secondCard.classList.remove('zoom');
                
                firstCard.classList.add('matched');
                secondCard.classList.add('matched');

                firstCard.removeEventListener('click', flipCard);
                secondCard.removeEventListener('click', flipCard);

                matchedPairs++;
                if (matchedPairs === pairData.length) {
                    setTimeout(() => {
                        document.getElementById('winModal').style.display = 'flex';
                    }, 600);
                }

                resetBoard();
            }, 1500);
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1200);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function initGame() {
            matchedPairs = 0;
            document.getElementById('winModal').style.display = 'none';
            createDeck();
            shuffle(cards);
            renderBoard();
        }

        initGame();
    </script>
</body>
</html>
